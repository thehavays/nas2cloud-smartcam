services:
  nas2cloud-smartcam:
    build: .
    container_name: nas2cloud-smartcam
    network_mode: "host"
    environment:
      - USERID=1000
      - GROUPID=1000
      - SYNC_INTERVAL=900
      - LOCAL_RETENTION_DAYS=7
      - REMOTE_RETENTION_DAYS=30
      - REMOTE_PATH=${REMOTE_PATH:-Nas2CloudBackup}
      - MOTION_DETECTION=${MOTION_DETECTION:-true}
      - MOTION_SENSITIVITY=${MOTION_SENSITIVITY:-0.04}
      - MOTION_CLIP_BUFFER=${MOTION_CLIP_BUFFER:-15}
      - MOTION_CHECK_INTERVAL=${MOTION_CHECK_INTERVAL:-600}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./data:/mnt/data
      - ./rclone:/app/rclone
    command: '-u "camera;camera123" -s "cam_storage;/mnt/data;yes;no;no;camera;camera;camera" -n -p -S -g "ntlm auth = ntlmv1-permitted" -g "server min protocol = NT1" -g "client min protocol = NT1" -g "netbios name = camnas"'
    restart: unless-stopped
